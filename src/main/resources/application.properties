spring.application.name=holdings
server.port=${PORT:8080}
# 台股時間一律用台北，不管主機時區
app.zone=Asia/Taipei

# 資料庫：H2 檔案模式，資料存在 ./data/holdings.mv.db（不用另外裝資料庫）
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/holdings;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true

# 只用 cookie 記 session，redirect 網址不要帶 ;jsessionid=
server.servlet.session.tracking-modes=cookie

# 官方行情。主機部分可用環境變數換掉，路徑與參數不變，例如：
#   TWSE_BASE_URL=http://localhost:9000 TPEX_BASE_URL=http://localhost:9000 ./mvnw spring-boot:run
quote.twse-base-url=${TWSE_BASE_URL:https://www.twse.com.tw}
quote.tpex-base-url=${TPEX_BASE_URL:https://www.tpex.org.tw}
quote.connect-timeout=3s
quote.request-timeout=4s
quote.lookup-timeout=8s
quote.twse-min-interval=2s
quote.tpex-min-interval=500ms
quote.blocked-backoff=10m
quote.stale-retry=20m
quote.failed-retry=5m
quote.refresh-check=5m
quote.refresh-enabled=true

# 除權息：今年的表每 3 小時重抓；背景每 10 分鐘檢查一次要不要補抓
dividend.current-year-refresh=3h
dividend.sync-check=10m

# BigDecimal 一律用一般寫法輸出，不出現 0E-8 這種科學記號
spring.jackson.generator.write-bigdecimal-as-plain=true
