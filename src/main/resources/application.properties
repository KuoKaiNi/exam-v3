spring.application.name=holdings
server.port=${PORT:8080}
# 台股時間一律用台北，不管主機時區
app.zone=Asia/Taipei

# 資料庫：H2 檔案模式，資料存在 ./data/holdings.mv.db（不用另外裝資料庫）
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/holdings}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true

# 只用 cookie 記 session，redirect 網址不要帶 ;jsessionid=
server.servlet.session.tracking-modes=cookie
