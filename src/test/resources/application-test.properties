# 測試用記憶體資料庫，每個 Spring context 各自一份
spring.datasource.url=jdbc:h2:mem:holdings-${random.uuid};DB_CLOSE_DELAY=-1
# 測試不可以連到證交所或櫃買中心：主機指到不存在的位址，背景更新關掉
quote.twse-base-url=http://127.0.0.1:9
quote.tpex-base-url=http://127.0.0.1:9
quote.refresh-enabled=false
quote.twse-min-interval=0s
quote.tpex-min-interval=0s
